# ===============================
# Code Execution (student coding playground)
# Override via env vars, e.g. CODE_EXECUTION_TIMEOUT_MS, CODE_EXECUTION_NODE_PATH
# ===============================
code.execution.timeout-ms=${CODE_EXECUTION_TIMEOUT_MS:5000}
code.execution.max-output-bytes=${CODE_EXECUTION_MAX_OUTPUT_BYTES:1048576}
code.execution.temp-dir=${CODE_EXECUTION_TEMP_DIR:${java.io.tmpdir}}
code.execution.javac-path=${CODE_EXECUTION_JAVAC_PATH:javac}
code.execution.java-path=${CODE_EXECUTION_JAVA_PATH:java}
code.execution.python-path=${CODE_EXECUTION_PYTHON_PATH:python}
code.execution.node-path=${CODE_EXECUTION_NODE_PATH:node}

# ===============================
# Invoice Generation & Management
# ===============================

# Invoice numbers: INV-<YEAR>-<6 digit database sequence>
invoice.number-prefix=INV

# PDFs are stored outside MySQL. Override with a persistent mounted volume
# (or point this at a shared/object-storage-backed mount in production).
invoice.storage-path=${INVOICE_STORAGE_PATH:${java.io.tmpdir}/foliopath360/invoices}

# Optional custom Unicode TTF font. Defaults to the bundled DejaVuSans font
# shipped with the jasperreports-fonts dependency (supports the ₹ glyph).
invoice.font-path=${INVOICE_PDF_FONT_PATH:}

# Authenticated dashboard route used in the invoice email. Never a public URL.
invoice.invoice-link-base-url=${INVOICE_LINK_BASE_URL:http://localhost:5173/student/invoices}

# Foliopath 360 brand details shown on the PDF and email.
invoice.company.name=Foliopath 360
invoice.company.legal-name=${INVOICE_COMPANY_LEGAL_NAME:Foliopath 360 Technologies Private Limited}
invoice.company.tagline=Learn. Grow. Go Beyond.
invoice.company.address-line-1=${INVOICE_COMPANY_ADDRESS_LINE_1:Plot 12, Tech Park Road}
invoice.company.address-line-2=${INVOICE_COMPANY_ADDRESS_LINE_2:Bengaluru, Karnataka 560103, India}
invoice.company.support-email=${INVOICE_SUPPORT_EMAIL:support@foliopath360.com}
invoice.company.contact-number=${INVOICE_CONTACT_NUMBER:+91 1800 123 4567}
invoice.company.website=${INVOICE_COMPANY_WEBSITE:https://www.foliopath360.com}
invoice.company.gstin=${INVOICE_COMPANY_GSTIN:}
invoice.company.state=${INVOICE_COMPANY_STATE:Karnataka}
invoice.company.terms=Payment is non-transferable. Access to purchased learning content begins on successful payment and continues for the enrolled batch validity period.
invoice.company.refund-policy=Refunds, if any, are governed by the Foliopath 360 Refund Policy published at https://www.foliopath360.com/refund-policy.

# GST configuration. Rates are percentages (18 means 18%).
# inclusive=true means the displayed course price already includes GST.
# Set inclusive=false for exclusive taxation at checkout.
invoice.tax.default-rate=${INVOICE_TAX_DEFAULT_RATE:0}
invoice.tax.inclusive=${INVOICE_TAX_INCLUSIVE:true}
invoice.tax.company-state=${INVOICE_COMPANY_STATE:Karnataka}

# Course-specific overrides / exemptions (comma-separated UUIDs):
# invoice.tax.rates-by-course.<course-uuid>=5
# invoice.tax.exempt-course-ids=<course-uuid>,<course-uuid>
invoice.tax.exempt-course-ids=
